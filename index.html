<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-200 min-h-screen flex flex-col">

    <!-- Toast Notification Container (acima dos modais) -->
    <div id="toast-container" class="fixed top-5 right-5 z-[60] flex flex-col gap-2 pointer-events-none" aria-live="polite"></div>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="flex-1 flex flex-col">

        <!-- ================= NAVBAR ================= -->
        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <button type="button" data-action="navigate" data-target="home" class="flex items-center gap-3 cursor-pointer text-left" aria-label="Ir para a página inicial">
                    <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white shadow-md shadow-brand-500/30">
                        <i class="fa-solid fa-hospital text-lg"></i>
                    </div>
                    <div>
                        <span class="font-bold text-lg tracking-tight">Vita<span class="text-brand-600">Schedule</span></span>
                        <span class="hidden sm:inline-block text-xs px-2 py-0.5 ml-2 bg-brand-50 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400 font-medium rounded-full">Clínica Médica</span>
                    </div>
                </button>

                <div class="flex items-center gap-3">
                    <!-- Theme Toggle -->
                    <button type="button" data-action="toggle-theme" class="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="Alternar Tema" aria-label="Alternar tema">
                        <i id="theme-icon" class="fa-solid fa-moon"></i>
                    </button>

                    <!-- Dynamic Header Action Buttons -->
                    <div id="header-actions" class="flex items-center gap-2">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </header>

        <!-- ================= VIEW CONTAINER ================= -->
        <main class="flex-1 flex flex-col">
            <div id="view-container" class="flex-1 flex flex-col">
                <!-- Views injected here -->
            </div>
        </main>

    </div>

    <!-- ================= MODALS ================= -->

    <!-- Login Modal -->
    <div id="login-modal" role="dialog" aria-modal="true" aria-labelledby="login-title" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl max-w-md w-full p-6 sm:p-8 border border-slate-100 dark:border-slate-700 relative">
            <button type="button" data-action="close-modal" data-modal="login-modal" aria-label="Fechar" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-brand-50 dark:bg-brand-900/50 text-brand-600 dark:text-brand-400 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                    <i class="fa-solid fa-user-doctor"></i>
                </div>
                <h3 id="login-title" class="text-xl font-bold">Acessar VitaSchedule</h3>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Informe suas credenciais para continuar</p>
            </div>

            <form id="login-form" data-submit="login" method="post" class="space-y-4">
                <div>
                    <label for="login-identifier" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">E-mail ou CPF</label>
                    <input type="text" id="login-identifier" name="identifier" autocomplete="username" maxlength="254" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:border-brand-500 text-sm">
                </div>
                <div>
                    <label for="login-password" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Senha</label>
                    <input type="password" id="login-password" name="password" autocomplete="current-password" maxlength="128" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:border-brand-500 text-sm">
                </div>

                <!-- Somente em DEMO_MODE (ver script). Remover em produção. -->
                <div id="login-demo-box" class="hidden p-3 rounded-xl bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 space-y-2">
                    <label for="login-role-preset" class="block text-xs font-semibold uppercase tracking-wider text-amber-700 dark:text-amber-300">Modo demonstração: perfil (preenche o e-mail)</label>
                    <select id="login-role-preset" data-change="fill-role" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:outline-none focus:border-brand-500 text-sm">
                        <option value="Patient">Paciente (Área do Paciente & Agendamento)</option>
                        <option value="Reception">Recepção (Fila, Convênios & Agenda Geral)</option>
                        <option value="Doctor">Médico(a) (Agenda, Prontuário & Bloqueio)</option>
                        <option value="Admin">Administrador (Usuários, LGPD & Configurações)</option>
                    </select>
                    <p id="login-demo-hint" class="text-xs text-amber-700 dark:text-amber-300"></p>
                </div>

                <p id="login-error" role="alert" class="hidden text-xs font-medium text-rose-600 dark:text-rose-400"></p>

                <button type="submit" id="login-submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-lg shadow-brand-500/30 transition duration-150 disabled:opacity-60">
                    Entrar no Sistema
                </button>
            </form>
        </div>
    </div>

    <!-- Booking Modal (conteúdo montado por JS) -->
    <div id="booking-modal" role="dialog" aria-modal="true" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl max-w-lg w-full p-6 sm:p-8 border border-slate-100 dark:border-slate-700 relative max-h-[90vh] overflow-y-auto" id="booking-modal-content">
            <!-- Dynamically Populated -->
        </div>
    </div>

    <!-- Block Time Modal (Médico) -->
    <div id="block-time-modal" role="dialog" aria-modal="true" aria-labelledby="block-title" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl max-w-md w-full p-6 sm:p-8 border border-slate-100 dark:border-slate-700 relative">
            <button type="button" data-action="close-modal" data-modal="block-time-modal" aria-label="Fechar" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <div class="mb-6">
                <h3 id="block-title" class="text-xl font-bold">Bloquear Horário / Férias</h3>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Impedir novos agendamentos no período selecionado</p>
            </div>
            <form id="block-form" data-submit="block-time" method="post" class="space-y-4">
                <div>
                    <label for="block-doctor" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Profissional</label>
                    <select id="block-doctor" name="doctor" class="w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm"></select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="block-date-start" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Data Início</label>
                        <input type="date" id="block-date-start" name="start" required class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm">
                    </div>
                    <div>
                        <label for="block-date-end" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Data Fim</label>
                        <input type="date" id="block-date-end" name="end" required class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm">
                    </div>
                </div>
                <div>
                    <label for="block-reason" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Motivo</label>
                    <input type="text" id="block-reason" name="reason" placeholder="Ex: Congresso Médicos, Folga, Férias" required minlength="3" maxlength="120" class="w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm">
                </div>
                <p id="block-error" role="alert" class="hidden text-xs font-medium text-rose-600 dark:text-rose-400"></p>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" data-action="close-modal" data-modal="block-time-modal" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-500 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 text-sm font-medium">Cancelar</button>
                    <button type="submit" class="px-6 py-2 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl text-sm transition">Confirmar Bloqueio</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom MessageBox / Confirm Modal (substitui alert/confirm nativos) -->
    <div id="message-modal" role="dialog" aria-modal="true" aria-labelledby="msg-modal-title" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center border border-slate-100 dark:border-slate-700">
            <div id="msg-modal-icon" class="w-12 h-12 bg-brand-50 text-brand-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                <i class="fa-solid fa-circle-info"></i>
            </div>
            <h4 id="msg-modal-title" class="font-bold text-lg mb-1">Aviso</h4>
            <p id="msg-modal-text" class="text-sm text-slate-500 dark:text-slate-400 mb-6 whitespace-pre-line">Mensagem detalhada aqui...</p>
            <div class="flex gap-3">
                <button type="button" id="msg-modal-cancel" data-action="msg-cancel" class="hidden flex-1 py-2.5 border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300 font-semibold rounded-xl text-sm">Cancelar</button>
                <button type="button" id="msg-modal-ok" data-action="msg-ok" class="flex-1 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl text-sm">OK</button>
            </div>
        </div>
    </div>


    <!-- ================= JAVASCRIPT APPLICATION CORE ================= -->
    <script>
    (function () {
        'use strict';

        // Anti-clickjacking de reserva: hospedagens sem cabeçalhos HTTP (ex.: GitHub Pages) não aplicam
        // frame-ancestors. Se a página estiver dentro de um <iframe> de outro site, não renderiza nada.
        if (window.top !== window.self) {
            document.body.replaceChildren();
            return;
        }

        // =====================================================================
        // AVISO IMPORTANTE: este arquivo é um PROTÓTIPO 100% no navegador.
        // Qualquer verificação feita aqui (login, perfis, regras) pode ser
        // contornada por quem controla o navegador. Em produção, autenticação,
        // autorização, validação, limitação de tentativas, criptografia dos
        // dados de saúde e trilha de auditoria DEVEM ser feitas no servidor.
        // =====================================================================

        // ---------------------------------------------------------------
        // Configuração
        // ---------------------------------------------------------------
        const API = '/api';
        let DEMO_MODE = false;                       // vem de GET /api/config (SEED_DEMO no servidor)
        let DEMO_PASSWORD_HINT = '';
        const IDLE_TIMEOUT_MS = 15 * 60 * 1000;      // Logout automático por inatividade (o servidor também expira a sessão)

        const ROLE_LABEL = { Patient: 'Paciente', Reception: 'Recepção', Doctor: 'Médico(a)', Admin: 'Administrador' };
        const PORTAL_LABEL = { Patient: 'Área do Paciente', Reception: 'Painel Recepção', Doctor: 'Portal Médico', Admin: 'Painel Admin' };
        const TAB_BY_ROLE = { Patient: 'patient-dashboard', Reception: 'reception-dashboard', Doctor: 'doctor-dashboard', Admin: 'admin-dashboard' };
        const DEMO_EMAIL_BY_ROLE = { Patient: 'paciente@vitamed.com', Reception: 'recepcao@vitamed.com', Doctor: 'mariana.souza@vitamed.com', Admin: 'admin@vitamed.com' };
        const PUBLIC_TABS = new Set(['home']);

        const STATUSES = ['Confirmado', 'Aguardando', 'Em atendimento', 'Finalizado', 'Faltou', 'Cancelado'];
        const INACTIVE_STATUSES = new Set(['Cancelado', 'Faltou']);   // não ocupam o horário
        const CANCELLABLE_STATUSES = new Set(['Confirmado', 'Aguardando']);

        const SLOTS = [
            { value: '09:00', label: '09:00 - 09:30' },
            { value: '10:15', label: '10:15 - 10:45' },
            { value: '14:00', label: '14:00 - 14:30' },
            { value: '16:30', label: '16:30 - 17:00' }
        ];

        const MODALS = new Set(['login-modal', 'booking-modal', 'block-time-modal', 'message-modal']);
        const ICONS = new Set(['fa-circle-info', 'fa-circle-check', 'fa-calendar-days', 'fa-file-medical', 'fa-key', 'fa-triangle-exclamation']);

        const PROTOCOL_RE = /^VIT-[A-Z0-9]{4,8}$/;
        const NAME_RE = /^\p{L}[\p{L}\p{M} .'’-]{2,99}$/u;

        // ---------------------------------------------------------------
        // Utilitários
        // ---------------------------------------------------------------
        const $ = (id) => document.getElementById(id);

        // Escapa texto para uso em HTML (conteúdo e atributos SEMPRE entre aspas).
        // Nunca use esta função para dados que vão dentro de JavaScript, URL ou CSS.
        const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' };
        function esc(value) {
            return String(value ?? '').replace(/[&<>"'`]/g, (c) => ESC_MAP[c]);
        }

        const onlyDigits = (s) => String(s ?? '').replace(/\D/g, '');

        function formatCPF(value) {
            const d = onlyDigits(value).slice(0, 11);
            if (d.length <= 3) return d;
            if (d.length <= 6) return `${d.slice(0, 3)}.${d.slice(3)}`;
            if (d.length <= 9) return `${d.slice(0, 3)}.${d.slice(3, 6)}.${d.slice(6)}`;
            return `${d.slice(0, 3)}.${d.slice(3, 6)}.${d.slice(6, 9)}-${d.slice(9)}`;
        }

        // Minimização de dados (LGPD): exibe apenas parte do CPF/nome onde o dado completo não é necessário.
        function maskCPF(cpf) {
            const d = onlyDigits(cpf);
            return d.length === 11 ? `***.${d.slice(3, 6)}.${d.slice(6, 9)}-**` : '***';
        }

        function formatPhone(value) {
            const d = onlyDigits(value).slice(0, 11);
            if (d.length <= 2) return d.length ? `(${d}` : '';
            if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`;
            if (d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
            return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
        }
        // DDD válido (11-99) + fixo (8 dígitos, inicia 2-5) ou celular (9 dígitos, inicia 9)
        function isValidPhone(value) {
            const d = onlyDigits(value);
            if (!/^[1-9][1-9]/.test(d)) return false;
            return (d.length === 10 && /^[2-5]/.test(d[2])) || (d.length === 11 && d[2] === '9');
        }
        const EMAIL_RE = /^[^\s@<>"'`,;:()\[\]\\]+@[^\s@<>"'`,;:()\[\]\\]+\.[A-Za-z]{2,}$/;
        function isValidEmail(value) {
            const v = String(value ?? '');
            return v.length <= 254 && EMAIL_RE.test(v);
        }
        function maskPhone(value) {
            const d = onlyDigits(value);
            return d.length >= 10 ? `(${d.slice(0, 2)}) *****-${d.slice(-4)}` : '***';
        }
        function maskEmail(value) {
            const [user, domain] = String(value ?? '').split('@');
            return user && domain ? `${user[0]}***@${domain}` : '***';
        }

        function maskName(name) {
            const parts = String(name ?? '').trim().split(/\s+/).filter(Boolean);
            if (!parts.length) return '';
            return [parts[0], ...parts.slice(1).map((p) => p[0].toUpperCase() + '.')].join(' ');
        }

        function isValidCPF(cpf) {
            const d = onlyDigits(cpf);
            if (d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
            const check = (len) => {
                let sum = 0;
                for (let i = 0; i < len; i++) sum += Number(d[i]) * (len + 1 - i);
                const r = (sum * 10) % 11;
                return r === 10 ? 0 : r;
            };
            return check(9) === Number(d[9]) && check(10) === Number(d[10]);
        }

        function todayISO() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
        function addDaysISO(iso, days) {
            const [y, m, d] = iso.split('-').map(Number);
            return new Date(Date.UTC(y, m - 1, d + days)).toISOString().slice(0, 10);
        }
        function daysBetween(a, b) {
            const [y1, m1, d1] = a.split('-').map(Number);
            const [y2, m2, d2] = b.split('-').map(Number);
            return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000);
        }
        function isValidISODate(s) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
            const [y, m, d] = s.split('-').map(Number);
            const dt = new Date(Date.UTC(y, m - 1, d));
            return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
        }

        // ---------------------------------------------------------------
        // Cliente da API (sessão em cookie HttpOnly; o front nunca vê token nem hash de senha)
        // ---------------------------------------------------------------
        class ApiError extends Error {
            constructor(status, message) { super(message); this.status = status; }
        }
        async function api(method, path, body) {
            let res;
            try {
                res = await fetch(API + path, {
                    method, credentials: 'same-origin', cache: 'no-store',
                    headers: Object.assign({ 'X-Requested-With': 'vitaschedule' }, body !== undefined ? { 'Content-Type': 'application/json' } : {}),
                    body: body !== undefined ? JSON.stringify(body) : undefined
                });
            } catch (_) {
                throw new ApiError(0, 'Sem conexão com o servidor. Tente novamente.');
            }
            let data = null;
            try { data = await res.json(); } catch (_) { /* resposta sem corpo */ }
            if (!res.ok) {
                if (res.status === 401 && state.currentUser) sessionExpired();
                const msg = data && typeof data.detail === 'string' ? data.detail : 'Não foi possível concluir a operação. Confira os dados.';
                throw new ApiError(res.status, msg);
            }
            return data;
        }

        // ---------------------------------------------------------------
        // Estado da aplicação (dentro de closure: não fica exposto em window)
        // ---------------------------------------------------------------
        const state = {
            currentUser: null,      // vem do servidor (GET /api/auth/me); null = visitante
            currentTab: 'home',
            doctors: [],            // inclui "busy" (horários ocupados) e "blocks" (períodos bloqueados), sem dados de pacientes
            appointments: [],       // já filtrados pelo servidor conforme o perfil
            admin: null,            // visão do administrador (usuários, auditoria, totais)
            loading: true
        };

        let lastActivity = Date.now();
        let pendingConfirm = null;
        const homeFilter = { specialty: '', insurance: '' };

        // Auditoria: registrada no servidor (tabela audit_log); o front não grava nem altera o log.

        // ---------------------------------------------------------------
        // Autorização
        // ---------------------------------------------------------------
        function canAccess(tab) {
            if (PUBLIC_TABS.has(tab)) return true;
            const u = state.currentUser;
            return !!u && TAB_BY_ROLE[u.role] === tab;
        }

        // Destino seguro quando a aba pedida não é permitida: o painel do próprio perfil (ou a home, se visitante).
        function defaultTab() {
            const u = state.currentUser;
            return u ? TAB_BY_ROLE[u.role] : 'home';
        }

        // Atalho de UI: esconde ações que o perfil não tem. A autorização de verdade é feita pelo servidor em cada requisição.
        function requireRole(...roles) {
            const u = state.currentUser;
            if (!u || !roles.includes(u.role)) {
                showToast('Acesso negado: você não tem permissão para esta ação.', 'error');
                return null;
            }
            return u;
        }

        // ---------------------------------------------------------------
        // Tema
        // ---------------------------------------------------------------
        function readTheme() {
            try { return localStorage.getItem('vitamed_theme') === 'dark' ? 'dark' : 'light'; }
            catch (_) { return 'light'; }
        }
        function applyTheme(theme) {
            document.documentElement.classList.toggle('dark', theme === 'dark');
            $('theme-icon').className = theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }
        function toggleTheme() {
            const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
            try { localStorage.setItem('vitamed_theme', next); } catch (_) { /* storage indisponível */ }
            applyTheme(next);
        }

        // ---------------------------------------------------------------
        // Toasts e modais (sempre via textContent - nunca innerHTML com mensagem)
        // ---------------------------------------------------------------
        function showToast(message, type = 'success') {
            const container = $('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600 text-white' : type === 'error' ? 'bg-rose-600 text-white' : 'bg-slate-800 text-white';
            const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info';

            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl font-medium text-sm transition-all duration-300 transform translate-y-2 opacity-0 ${bgClass}`;
            const i = document.createElement('i');
            i.className = `fa-solid ${icon} text-lg`;
            const span = document.createElement('span');
            span.textContent = String(message);
            toast.append(i, span);

            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function setMessage(title, text, iconClass) {
            $('msg-modal-title').textContent = title;
            $('msg-modal-text').textContent = text;
            const icon = document.createElement('i');
            icon.className = 'fa-solid ' + (ICONS.has(iconClass) ? iconClass : 'fa-circle-info');
            $('msg-modal-icon').replaceChildren(icon);
        }
        function showMessageBox(title, text, iconClass = 'fa-circle-info') {
            pendingConfirm = null;
            $('msg-modal-cancel').classList.add('hidden');
            setMessage(title, text, iconClass);
            openModal('message-modal');
        }
        function showConfirm(title, text, onConfirm, iconClass = 'fa-triangle-exclamation') {
            setMessage(title, text, iconClass);
            pendingConfirm = onConfirm;
            $('msg-modal-cancel').classList.remove('hidden');
            openModal('message-modal');
        }

        function openModal(id) { if (MODALS.has(id)) $(id).classList.remove('hidden'); }
        function closeModal(id) {
            if (!MODALS.has(id)) return;
            $(id).classList.add('hidden');
            if (id === 'message-modal') pendingConfirm = null;
            if (id === 'login-modal') resetLoginForm();
        }
        function closeAllModals() { MODALS.forEach(closeModal); }

        function showFormError(box, message) { box.textContent = message; box.classList.remove('hidden'); }
        function clearFormError(box) { box.textContent = ''; box.classList.add('hidden'); }

        // ---------------------------------------------------------------
        // Autenticação
        // ---------------------------------------------------------------
        function fillRolePreset(role) {
            if (Object.hasOwn(DEMO_EMAIL_BY_ROLE, role)) $('login-identifier').value = DEMO_EMAIL_BY_ROLE[role];
        }
        function resetLoginForm() {
            $('login-form').reset();
            clearFormError($('login-error'));
        }
        function openLoginModal() {
            resetLoginForm();
            $('login-demo-box').classList.toggle('hidden', !DEMO_MODE);
            if (DEMO_MODE) {
                $('login-demo-hint').textContent = `Senha das contas de demonstração: ${DEMO_PASSWORD_HINT}`;
                fillRolePreset($('login-role-preset').value);
            }
            openModal('login-modal');
            $('login-password').focus();
        }

        let loginInFlight = false;
        async function handleLogin(form) {
            if (loginInFlight) return;
            const errBox = $('login-error');
            clearFormError(errBox);

            const identifier = String(form.elements['identifier'].value).trim().slice(0, 254);
            const password = String(form.elements['password'].value).slice(0, 128);
            form.elements['password'].value = ''; // nunca mantém a senha no DOM
            if (!identifier || !password) return showFormError(errBox, 'Informe e-mail/CPF e senha.');

            loginInFlight = true;
            $('login-submit').disabled = true;
            try {
                const res = await api('POST', '/auth/login', { identifier, password });
                await startSession(res.user);
            } catch (e) {
                showFormError(errBox, e instanceof ApiError && e.status !== 0 && e.status < 500 ? e.message : 'Não foi possível concluir o login. Tente novamente.');
            } finally {
                loginInFlight = false;
                $('login-submit').disabled = false;
            }
        }

        async function refreshData() {
            const u = state.currentUser;
            const jobs = [api('GET', '/doctors').then((d) => { state.doctors = d; })];
            if (u && ['Patient', 'Reception', 'Doctor'].includes(u.role)) jobs.push(api('GET', '/appointments').then((a) => { state.appointments = a; }));
            if (u && u.role === 'Admin') jobs.push(api('GET', '/admin/overview').then((o) => { state.admin = o; }));
            await Promise.all(jobs);
        }

        async function startSession(user) {
            // Perfil e identidade vêm do SERVIDOR. Cópia imutável.
            state.currentUser = Object.freeze({
                id: user.id, name: user.name, email: user.email, role: user.role,
                cpf: user.cpf || null, doctorName: user.doctorName || null
            });
            lastActivity = Date.now();
            closeAllModals();
            try { await refreshData(); } catch (_) { showToast('Não foi possível carregar os dados.', 'error'); }
            showToast(`Bem-vindo(a), ${user.name} (${ROLE_LABEL[user.role]})!`, 'success');
            router.navigate(TAB_BY_ROLE[user.role]);
        }

        function clearSession() {
            state.currentUser = null;
            state.appointments = [];
            state.admin = null;
            closeAllModals();
            $('booking-modal-content').replaceChildren(); // remove dados do DOM
        }

        function sessionExpired() {
            clearSession();
            showToast('Sessão expirada. Entre novamente.', 'info');
            router.navigate('home');
            api('GET', '/doctors').then((d) => { state.doctors = d; render(); }).catch(() => {});
        }

        async function logout(message) {
            if (!state.currentUser) return;
            try { await api('POST', '/auth/logout'); } catch (_) { /* cookie expira sozinho */ }
            clearSession();
            showToast(message || 'Sessão encerrada com sucesso.', 'info');
            router.navigate('home');
        }

        // ---------------------------------------------------------------
        // Roteamento
        // ---------------------------------------------------------------
        const router = {
            navigate(tab) {
                if (!canAccess(tab)) {
                    if (!PUBLIC_TABS.has(tab)) showToast('Acesso negado. Entre com um perfil autorizado.', 'error');
                    tab = defaultTab();
                }
                state.currentTab = tab;
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        // ---------------------------------------------------------------
        // Agendamento
        // ---------------------------------------------------------------
        function isBlocked(doc, date) {
            return doc.blocks.some(([start, end]) => date >= start && date <= end);
        }
        function isSlotTaken(doc, date, time) {
            return doc.busy.some(([d, t]) => d === date && t === time);
        }

        // Disponibilidade: dias da semana (0=dom) e horários de cada médico, menos bloqueios, horários ocupados e horários já passados.
        // (O servidor revalida tudo ao agendar; isto só evita mostrar opções inválidas.)
        const WEEKDAY_SHORT = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
        const weekdayOf = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); };
        const brDate = (iso) => `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}`;
        function freeSlots(doc, date) {
            if (!doc || !isValidISODate(date) || !doc.days.includes(weekdayOf(date)) || isBlocked(doc, date)) return [];
            const now = new Date();
            const nowHM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            return doc.slots.filter((t) => !isSlotTaken(doc, date, t) && !(date === todayISO() && t <= nowHM));
        }
        function availableDates(doc, limit = 30) {
            const out = [];
            const today = todayISO();
            for (let i = 0; i <= 120 && out.length < limit; i++) {
                const iso = addDaysISO(today, i);
                if (freeSlots(doc, iso).length) out.push(iso);
            }
            return out;
        }
        function dateOptionsHTML(doc) {
            const dates = availableDates(doc);
            if (!dates.length) return '<option value="">Sem datas disponíveis</option>';
            return dates.map((d) => `<option value="${esc(d)}">${esc(WEEKDAY_SHORT[weekdayOf(d)])}, ${esc(brDate(d))}</option>`).join('');
        }
        function timeOptionsHTML(doc, date) {
            const free = freeSlots(doc, date);
            if (!free.length) return '<option value="">Sem horários</option>';
            return free.map((t) => {
                const slot = SLOTS.find((x) => x.value === t);
                return `<option value="${esc(t)}">${esc(slot ? slot.label : t)}</option>`;
            }).join('');
        }
        function workDaysLabel(doc) { return doc.days.map((d) => WEEKDAY_SHORT[d]).join(', '); }
        function nextSlotLabel(doc) {
            const d = availableDates(doc, 1)[0];
            if (!d) return 'Sem vagas';
            const t = freeSlots(doc, d)[0];
            const diff = daysBetween(todayISO(), d);
            return `${diff === 0 ? 'Hoje' : diff === 1 ? 'Amanhã' : `${WEEKDAY_SHORT[weekdayOf(d)]} ${brDate(d).slice(0, 5)}`}, ${t}`;
        }

        function insuranceOptionsHTML(doc) {
            return doc.insurance.map((i) => `<option value="${esc(i)}">${esc(i)}</option>`).join('');
        }

        // doctorId === null  ->  recepção escolhe o profissional no próprio formulário
        function openBookingModal(doctorId) {
            const chooser = doctorId === null;
            const doc = chooser ? state.doctors[0] : state.doctors.find((d) => d.id === doctorId);
            if (!doc) return;

            const u = state.currentUser;
            const lockIdentity = !!u && u.role === 'Patient'; // paciente logado agenda SOMENTE para si
            const today = todayISO();
            const inputCls = 'w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm';
            const labelCls = 'block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1';

            const headerHTML = chooser
                ? `<div class="mb-5">
                        <h3 id="book-title" class="text-lg font-bold">Novo Agendamento Presencial</h3>
                        <p class="text-xs text-slate-500">Selecione o profissional e preencha os dados do paciente.</p>
                   </div>`
                : `<div class="mb-5 flex items-center gap-3">
                        <div class="w-12 h-12 rounded-full bg-brand-500 text-white font-bold flex items-center justify-center">${esc(doc.avatar)}</div>
                        <div>
                            <h3 id="book-title" class="text-lg font-bold">${esc(doc.name)}</h3>
                            <p class="text-xs text-brand-600 font-semibold">${esc(doc.specialty)}</p>
                        </div>
                   </div>`;

            const doctorFieldHTML = chooser
                ? `<div>
                        <label class="${labelCls}" for="book-doctor">Profissional</label>
                        <select id="book-doctor" name="doctorId" data-change="booking-doctor" class="${inputCls}">
                            ${state.doctors.map((d) => `<option value="${Number(d.id)}">${esc(d.name)} - ${esc(d.specialty)}</option>`).join('')}
                        </select>
                   </div>`
                : `<input type="hidden" name="doctorId" value="${Number(doc.id)}">`;

            const identityHTML = lockIdentity
                ? `<div>
                        <label class="${labelCls}">Paciente</label>
                        <input type="text" value="${esc(u.name)}" readonly class="${inputCls} opacity-80">
                   </div>
                   <div>
                        <label class="${labelCls}">CPF</label>
                        <input type="text" value="${esc(maskCPF(u.cpf))}" readonly class="${inputCls} opacity-80">
                   </div>`
                : `<div>
                        <label class="${labelCls}" for="book-name">Nome Completo do Paciente</label>
                        <input type="text" id="book-name" name="patientName" maxlength="100" autocomplete="off" required class="${inputCls}">
                   </div>
                   <div>
                        <label class="${labelCls}" for="book-cpf">CPF (Validação)</label>
                        <input type="text" id="book-cpf" name="cpf" data-mask="cpf" inputmode="numeric" maxlength="14" autocomplete="off" placeholder="000.000.000-00" required class="${inputCls}">

        function handleBookingDoctorChange(select) {

        function handleBookingDateChange(select) {
            const form = select.form;
            if (!form) return;

            if (doc) form.elements['time'].innerHTML = timeOptionsHTML(doc, select.value);
        }

        let bookingInFlight = false;
        async function handleConfirmBooking(form) {
            if (bookingInFlight) return;
            const errBox = $('book-error');
            clearFormError(errBox);
            const fail = (msg) => showFormError(errBox, msg);

            const fd = new FormData(form);
            const doc = state.doctors.find((d) => d.id === Number(fd.get('doctorId')));
            if (!doc) return fail('Profissional inválido.');

            // Validação de conveniência (resposta rápida); o servidor valida tudo de novo e é quem decide.
            const u = state.currentUser;
            const isPatient = !!u && u.role === 'Patient';
            const patientName = String(fd.get('patientName') || '').trim().replace(/\s+/g, ' ');
            const cpf = String(fd.get('cpf') || '');
            if (!isPatient) {
                if (!NAME_RE.test(patientName)) return fail('Informe o nome completo (apenas letras, de 3 a 100 caracteres).');
                if (!isValidCPF(cpf)) return fail('CPF inválido.');
            }
            const phone = String(fd.get('phone') || '').trim();
            const email = String(fd.get('email') || '').trim().toLowerCase();
            if (!isValidPhone(phone)) return fail('Telefone inválido. Informe DDD + número (ex: (11) 91234-5678).');
            if (!isValidEmail(email)) return fail('E-mail inválido.');
            const date = String(fd.get('date') || '');
            const time = String(fd.get('time') || '');
            if (!isValidISODate(date) || !time) return fail('Selecione uma data e um horário disponíveis.');
            if (fd.get('consent') !== 'on') return fail('É necessário consentir com o tratamento de dados (LGPD).');

            const payload = {
                doctorId: doc.id, phone, email, insurance: String(fd.get('insurance') || ''), date, time, consent: true
            };
            if (!isPatient) { payload.patientName = patientName; payload.cpf = cpf; } // paciente logado: identidade vem da sessão

            bookingInFlight = true;
            try {
                const r = await api('POST', '/appointments', payload);
                closeModal('booking-modal');
                try { await refreshData(); } catch (_) { /* a tela atualiza no próximo carregamento */ }
                const reminderInfo = r.reminderDate
                    ? `Lembrete agendado para ${brDate(r.reminderDate)} (1 dia antes).`
                    : 'Consulta em menos de 1 dia: não haverá lembrete.';
                showMessageBox('Agendamento Realizado com Sucesso!',
                    `Consulta com ${r.doctorName} em ${brDate(r.date)} às ${r.time}.\n\nProtocolo: ${r.protocol}\nConfirmação para: ${maskEmail(r.email)} e ${maskPhone(r.phone)}\n${reminderInfo}\n\n(O envio real de e-mail/SMS ainda não está ligado: confirmação e lembrete ficam apenas registrados.)\nGuarde o protocolo e o CPF do paciente para consultar o status.`, 'fa-circle-check');
                render();
            } catch (e) {
                fail(e.message);
                if (e.status === 409) { // horário tomado por outra pessoa: atualiza as opções
                    try {
                        await refreshData();
                        const dateSel = form.elements['date'];
                        const docNow = state.doctors.find((d) => d.id === doc.id);
                        if (docNow && dateSel) {
                            dateSel.innerHTML = dateOptionsHTML(docNow);
                            form.elements['time'].innerHTML = timeOptionsHTML(docNow, dateSel.value);
                        }
                    } catch (_) { /* mantém o formulário */ }
                }
            } finally {
                bookingInFlight = false;
            }
        }

        // ---------------------------------------------------------------
        // Consulta pública de status (exige protocolo + CPF; retorna dados mínimos)
        // ---------------------------------------------------------------
        async function checkPublicStatus(form) {
            const box = $('public-status-result');
            const show = (html) => { box.innerHTML = html; box.classList.remove('hidden'); };
            const errorHTML = (msg) => `<div class="p-4 rounded-xl bg-rose-50 dark:bg-rose-900/30 text-rose-700 dark:text-rose-300 text-sm flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation"></i> ${esc(msg)}</div>`;

            const fd = new FormData(form);
            const protocol = String(fd.get('protocol') || '').trim().toUpperCase().slice(0, 12);
            const cpfDigits = onlyDigits(fd.get('cpf')).slice(0, 11);
            if (!PROTOCOL_RE.test(protocol) || cpfDigits.length !== 11) {
                return show(errorHTML('Informe um protocolo válido (ex: VIT-8092) e o CPF com 11 dígitos.'));
            }

            let appt;
            try {
                appt = await api('POST', '/appointments/lookup', { protocol, cpf: cpfDigits });
            } catch (e) {
                // O 404 é genérico de propósito: não revela se o protocolo ou o CPF existem.
                return show(errorHTML(e.message));
            }

            show(`
                <div class="p-5 rounded-2xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 space-y-3 text-left">
                    <div class="flex items-center justify-between">

                    <p class="text-[11px] text-slate-400">Dados de convênio e identificação completa ficam disponíveis apenas na Área do Paciente.</p>
                </div>
            `);

        async function openPEP(id) {

            } catch (e) {
                return showToast(e.message, 'error');
            }
            const text = rec.found
                ? `Paciente: ${rec.name}\nConvênio: ${rec.insurance}\n\nObservações clínicas:\n${rec.notes}`
                : 'Nenhum registro clínico encontrado para este paciente.';
            showMessageBox('Prontuário Eletrônico (PEP)', text, 'fa-file-medical');

        function openBlockModal() {
            const u = requireRole('Doctor');
            if (!u) return;
            const form = $('block-form');
            form.reset();
            clearFormError($('block-error'));
            const sel = $('block-doctor');
            sel.replaceChildren(new Option(u.doctorName, u.doctorName)); // médico só vê/bloqueia a própria agenda
            const today = todayISO();
            $('block-date-start').min = today;
            $('block-date-end').min = today;
            openModal('block-time-modal');
        }

        async function handleBlockTime(form) {
            if (!requireRole('Doctor')) return;
            const errBox = $('block-error');
            clearFormError(errBox);
            const fail = (msg) => showFormError(errBox, msg);

            const fd = new FormData(form);
            const start = String(fd.get('start') || '');
            const end = String(fd.get('end') || '');
            if (!isValidISODate(start) || !isValidISODate(end)) return fail('Datas inválidas.');
            if (start < todayISO()) return fail('A data de início não pode estar no passado.');
            if (end < start) return fail('A data final deve ser igual ou posterior à inicial.');
            if (daysBetween(start, end) > 365) return fail('O bloqueio não pode ultrapassar 365 dias.');
            const reason = String(fd.get('reason') || '').trim().replace(/\s+/g, ' ');
            if (reason.length < 3 || reason.length > 120) return fail('Informe um motivo de 3 a 120 caracteres.');

            try {
                await api('POST', '/blocks', { start, end, reason }); // o médico é o da sessão, nunca um campo do formulário
                await refreshData();
            } catch (e) {
                return fail(e.message);
            }
            closeModal('block-time-modal');
            showToast('Período bloqueado com sucesso na agenda.', 'success');
        }

        async function resetUserPassword(userId) {
            if (!requireRole('Admin')) return;
            try {
                const r = await api('POST', `/admin/users/${Number(userId)}/reset-password`);
                showMessageBox('Redefinição Solicitada', `A solicitação para ${r.email} foi registrada na auditoria. O envio do e-mail de redefinição ainda não está ligado.`, 'fa-key');

                showToast(e.message, 'error');

        function deleteUser(userId) {
            const me = requireRole('Admin');
            if (!me) return;
            const target = state.admin && state.admin.users.find((x) => x.id === userId);
            if (!target) return;
            if (target.id === me.id) return showToast('Você não pode remover a própria conta.', 'error');
            showConfirm('Remover usuário?', `A conta de ${target.email} será removida. Esta ação não pode ser desfeita.`, async () => {
                try {
                    await api('DELETE', `/admin/users/${Number(userId)}`); // o servidor reconfere permissão e regras
                    await refreshData();
                    showToast('Usuário removido com sucesso.', 'info');
                } catch (e) {
                    showToast(e.message, 'error');
                }
                render();
            });
        }

        // ================= EVENTOS (delegação; sem handlers inline) =================

        const actions = {
            'navigate': (el) => router.navigate(el.dataset.target),
            'toggle-theme': () => toggleTheme(),
            'open-login': () => openLoginModal(),
            'close-modal': (el) => closeModal(el.dataset.modal),
            'logout': () => logout(),
            'book': (el) => openBookingModal(Number(el.dataset.doctorId)),
            'book-new': () => { if (requireRole('Reception')) openBookingModal(null); },
            'filter-doctors': () => filterDoctorsList(),
            'reschedule': () => showMessageBox('Reagendar Consulta', 'Entre em contato com a recepção ou cancele para remarcar.', 'fa-calendar-days'),

                const id = el.dataset.id;

            },
            'open-pep': (el) => openPEP(el.dataset.id),
            'open-block': () => openBlockModal(),
            'reset-password': (el) => resetUserPassword(Number(el.dataset.userId)),
            'delete-user': (el) => deleteUser(Number(el.dataset.userId)),
            'msg-ok': () => {
                const cb = pendingConfirm;
                pendingConfirm = null;
                closeModal('message-modal');
                if (typeof cb === 'function') cb();
            },
            'msg-cancel': () => closeModal('message-modal')
        };

        const submitHandlers = {
            'login': (form) => { handleLogin(form); },
            'confirm-booking': handleConfirmBooking,
            'public-status': checkPublicStatus,
            'block-time': handleBlockTime
        };

        const changeHandlers = {
            'fill-role': (el) => fillRolePreset(el.value),
            'booking-doctor': handleBookingDoctorChange,
            'booking-date': handleBookingDateChange,
            'filter-doctors': () => filterDoctorsList(),
            'update-status': (el) => updateAppointmentStatus(el.dataset.id, el.value)
        };

        document.addEventListener('click', (e) => {
            const el = e.target instanceof Element ? e.target.closest('[data-action]') : null;
            if (!el) return;
            const name = el.dataset.action;
            if (Object.hasOwn(actions, name)) actions[name](el, e);
        });

        document.addEventListener('submit', (e) => {
            e.preventDefault(); // nenhum formulário é enviado ao navegador/rede
            const form = e.target;
            const name = form && form.dataset ? form.dataset.submit : undefined;
            if (name && Object.hasOwn(submitHandlers, name)) submitHandlers[name](form);
        });

        document.addEventListener('change', (e) => {
            const el = e.target;
            const name = el && el.dataset ? el.dataset.change : undefined;
            if (name && Object.hasOwn(changeHandlers, name)) changeHandlers[name](el);
        });

        document.addEventListener('input', (e) => {
            const el = e.target;
            if (!el || !el.dataset) return;
            if (el.dataset.mask === 'cpf') el.value = formatCPF(el.value);
            else if (el.dataset.mask === 'phone') el.value = formatPhone(el.value);
        });

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllModals(); });

        // Inatividade: encerra a sessão para não deixar dados de pacientes expostos em tela.
        ['click', 'keydown', 'pointerdown'].forEach((evt) =>
            document.addEventListener(evt, () => { lastActivity = Date.now(); }, { passive: true, capture: true }));
        setInterval(() => {
            if (state.currentUser && Date.now() - lastActivity > IDLE_TIMEOUT_MS) {
                logout('Sessão encerrada por inatividade.');
            }
        }, 15000);

        // Inicialização: lê config e sessão atual do servidor (cookie HttpOnly) e carrega os médicos.
        applyTheme(readTheme());
        render();
        (async () => {
            try {
                const cfg = await api('GET', '/config');
                DEMO_MODE = !!cfg.demo;
                DEMO_PASSWORD_HINT = cfg.demoPassword || '';
                const me = await api('GET', '/auth/me');
                if (me.user) state.currentUser = Object.freeze(Object.assign({ cpf: null, doctorName: null }, me.user));
                await refreshData();
                if (state.currentUser) state.currentTab = TAB_BY_ROLE[state.currentUser.role];
            } catch (_) {
                showToast('Não foi possível falar com o servidor. Recarregue a página.', 'error');
            }
            state.loading = false;
            render();
        })();
    })();
    </script>
