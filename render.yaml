# Blueprint do Render: um serviço web (API FastAPI + index.html, mesma origem) e um Postgres.
# Uso: Render > New > Blueprint > selecione este repositório.
services:
  - type: web
    name: vitaschedule
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r api/requirements.txt
    # Aplica as migrações do Alembic antes de subir. proxy-headers: IP real do cliente atrás do proxy do Render.
    startCommand: cd api && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vitaschedule-db
          property: connectionString
      # Contas e dados FICTÍCIOS de demonstração. Para uso real: SEED_DEMO=false e crie usuários de verdade.
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        sync: false   # o Render pede o valor no primeiro deploy

databases:
  - name: vitaschedule-db
    plan: free
    region: oregon
