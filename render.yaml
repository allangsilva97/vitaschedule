# Blueprint do Render: um serviço web (API FastAPI + index.html, mesma origem) e um Postgres.
# Uso: Render > New > Blueprint > selecione este repositório.
services:
  - type: web
    name: vitaschedule
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r api/requirements.txt
    # Aplica as migrações do Alembic antes de subir. Não use --forwarded-allow-ips='*': o uvicorn passaria a
    # confiar no X-Forwarded-For enviado pelo cliente e os limitadores de tentativas seriam burlados.
    startCommand: cd api && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      # Quantos proxies de confiança ficam na frente do app (IP do cliente = última entrada do X-Forwarded-For).
      # Confira nos logs de um deploy real se o IP gravado é o do visitante; se aparecer o IP do proxy, ajuste.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vitaschedule-db
          property: connectionString
      # Contas e dados FICTÍCIOS de demonstração. Para uso real: SEED_DEMO=false e crie usuários de verdade.
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        sync: false   # o Render pede o valor no primeiro deploy

databases:
  - name: vitaschedule-db
    plan: free
    region: oregon
